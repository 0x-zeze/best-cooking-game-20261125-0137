<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMBER LINE — cook in the temperature band</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #141a21;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * 1280 / 800);
      max-height: calc(100vw * 800 / 1280);
      touch-action: manipulation;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas
    id="game"
    width="1280"
    height="800"
    aria-label="Ember Line — temperature-band cooking game with four burners, timed order tickets, ingredient counter, and assembly plate"
  ></canvas>
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
